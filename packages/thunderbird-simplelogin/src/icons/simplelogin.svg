<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Envelope with a fork in the delivery path: one address in, another out.
       Fixed colours rather than context-fill: toolbar icon theming is not
       reliably applied to add-on SVGs, and a mid-tone grey with a green accent
       stays legible on both light and dark toolbars. -->

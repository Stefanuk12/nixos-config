  <path d="M3.5 9.5 12.5 16.5 21.5 9.5" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M19 25.5h5a4 4 0 0 0 4-4v-9" fill="none" stroke="#2ea043" stroke-width="2" stroke-linecap="round"/>
  <circle cx="28" cy="9.5" r="3" fill="#2ea043"/>
  <circle cx="18.5" cy="25.5" r="2.5" fill="#2ea043"/>
</svg>
